<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Dusk</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a89bff" />
              <stop offset="1" stop-color="#f6b34a" />
            </linearGradient>
          </defs>
          <path fill="url(#g)" d="M20.6 3.4A13 13 0 1 0 28.6 21 10.5 10.5 0 0 1 20.6 3.4Z" />
        </svg>
        <span class="name">Dusk</span>
      </div>
      <span class="chip" id="chip"></span>
    </header>

    <section class="card power">
      <div class="row">
        <div>
          <div class="title" data-i18n="darkMode"></div>
          <div class="sub" id="powerSub"></div>
        </div>
        <label class="switch big">
          <input type="checkbox" id="power" />
          <span></span>
        </label>
      </div>
      <button class="link" id="resume" hidden data-i18n="resumeSchedule"></button>
    </section>

    <section class="card">
      <div class="row">
        <div class="title" data-i18n="schedule"></div>
        <label class="switch">
          <input type="checkbox" id="scheduleOn" />
          <span></span>
        </label>
      </div>
      <div id="scheduleBody">
        <div class="times">
          <label class="time">
            <span data-i18n="turnOnAt"></span>
            <input type="time" id="start" required />
          </label>
          <span class="arrow" aria-hidden="true">→</span>
          <label class="time">
            <span data-i18n="turnOffAt"></span>
            <input type="time" id="end" required />
          </label>
        </div>
        <div class="timeline" aria-hidden="true">
          <div class="track" id="track"><div class="now" id="now"></div></div>
          <div class="ticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
        </div>
      </div>
    </section>

    <section class="card site" id="siteCard">
      <div class="row">
        <div class="title" data-i18n="thisSite"></div>
        <div class="host" id="host"></div>
      </div>
      <div class="segmented" id="modes" role="radiogroup">
        <button role="radio" data-mode="auto" data-i18n="modeAuto"></button>
        <button role="radio" data-mode="convert" data-i18n="modeConvert"></button>
        <button role="radio" data-mode="off" data-i18n="modeOff"></button>
      </div>
      <div class="status" id="status"><i></i><span></span></div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
