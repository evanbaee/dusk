<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit — Listening</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0b10; color: #ececf3; font: 15px/1.5 -apple-system, system-ui, sans-serif; display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  nav { background: #111119; padding: 24px 18px; border-right: 1px solid #1d1d28; }
  nav b { display: block; font-size: 20px; margin-bottom: 26px; background: linear-gradient(90deg, #ff6ab0, #ffb86b); -webkit-background-clip: text; color: transparent; }
  nav div { padding: 8px 10px; border-radius: 8px; color: #8d8da3; margin-bottom: 2px; }
  nav div.on { background: #1c1c2a; color: #fff; }
  main { padding: 30px 36px; }
  h1 { margin: 0 0 4px; font-size: 28px; } .sub { color: #8d8da3; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .card { background: #15151f; border: 1px solid #22222f; border-radius: 14px; padding: 14px; }
  .art { height: 150px; border-radius: 10px; margin-bottom: 12px; }
  .card b { display: block; } .card span { color: #8d8da3; font-size: 13px; }
  .a1 { background: linear-gradient(135deg, #ff6ab0, #7c4dff); } .a2 { background: linear-gradient(135deg, #00d4a6, #0077ff); }
  .a3 { background: linear-gradient(135deg, #ffb86b, #ff4d6d); } .a4 { background: linear-gradient(135deg, #b8f35d, #12b886); }
  .player { margin-top: 26px; background: #15151f; border: 1px solid #22222f; border-radius: 14px; padding: 18px 20px; display: flex; align-items: center; gap: 18px; }
  .play { width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #0b0b10; display: grid; place-items: center; font-size: 18px; }
  .bar { flex: 1; height: 6px; border-radius: 999px; background: #262636; position: relative; } .bar i { position: absolute; inset: 0 62% 0 0; border-radius: 999px; background: linear-gradient(90deg, #ff6ab0, #ffb86b); }
  .chip { background: #ffe066; color: #2b2100; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 999px; }
</style>
</head>
<body>
<nav><b>Orbit</b><div class="on">Listen now</div><div>Browse</div><div>Radio</div><div>Library</div><div>Playlists</div></nav>
<main>
  <h1>Good evening</h1><div class="sub">Picked for your late-night focus <span class="chip">NEW</span></div>
  <div class="grid">
    <div class="card"><div class="art a1"></div><b>Midnight Drive</b><span>Synthwave · 42 songs</span></div>
    <div class="card"><div class="art a2"></div><b>Deep Focus</b><span>Ambient · 3 h 10 min</span></div>
    <div class="card"><div class="art a3"></div><b>Late Jazz</b><span>Jazz · 58 songs</span></div>
    <div class="card"><div class="art a4"></div><b>Night Run</b><span>Electronic · 31 songs</span></div>
  </div>
  <div class="player"><div class="play">▶</div><div><b>Neon Rain</b><br><span style="color:#8d8da3;font-size:13px">Aurora Lanes</span></div><div class="bar"><i></i></div><span style="color:#8d8da3;font-size:13px">1:24 / 3:48</span></div>
</main>
</body>
</html>
