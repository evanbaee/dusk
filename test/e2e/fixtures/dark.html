<title>Already dark</title>
<style>
  body { margin: 0; padding: 32px; background: #0b0b0f; color: #e5e5e5; font: 15px/1.6 system-ui, sans-serif; }

<body><h1>An <span class="accent">already dark</span> site</h1><div class="card">Dusk must leave this page exactly as designed, including the <span class="chip">yellow chip</span>.</div></body>
