<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JS theme</title>
<script>
  // next-themes style: pick the theme from the system preference before first paint.
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
</script>
<style>
  body { margin: 0; padding: 32px; font: 15px/1.6 system-ui, sans-serif; background: #fafafa; color: #18181b; }
  .dark body { background: #18181b; color: #fafafa; }
  .panel { padding: 16px; border-radius: 10px; background: #fff; border: 1px solid #e4e4e7; }
  .dark .panel { background: #27272a; border-color: #3f3f46; }
</style>
</head>
<body><h1>JS-driven theme</h1><div class="panel">This page picks its theme with <code>matchMedia</code> in an inline script, like next-themes.</div></body>
</html>
