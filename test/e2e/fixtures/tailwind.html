<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tailwind + shadcn</title>
<style>
  :root { --background: 0 0% 100%; --foreground: 222.2 84% 4.9%; --muted: 210 40% 96.1%; --muted-foreground: 215.4 16.3% 46.9%; --border: 214.3 31.8% 91.4%; --primary: 222.2 47.4% 11.2%; --primary-foreground: 210 40% 98%; }
  .dark { --background: 222.2 84% 4.9%; --foreground: 210 40% 98%; }
  body { margin: 0; padding: 32px; font: 15px/1.6 system-ui, sans-serif; background-color: hsl(var(--background)); color: hsl(var(--foreground)); }
  .card { border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .muted { background-color: hsl(var(--muted)); color: hsl(var(--muted-foreground)); padding: 8px 12px; border-radius: 8px; }
  .btn { background-color: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border: 0; padding: 8px 14px; border-radius: 8px; }
  .tw-bg { --tw-bg-opacity: 1; background-color: rgb(239 246 255 / var(--tw-bg-opacity)); }
  .tw-text { --tw-text-opacity: 1; color: rgb(29 78 216 / var(--tw-text-opacity)); }
  .shadow { --tw-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); box-shadow: var(--tw-shadow); }
  .grad { --tw-gradient-from: #ffffff var(--tw-gradient-from-position); --tw-gradient-to: #f1f5f9 var(--tw-gradient-to-position); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); background-image: linear-gradient(to bottom, var(--tw-gradient-stops)); padding: 16px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="grad"><h1>shadcn/ui &amp; Tailwind variables</h1></div>
  <div class="card shadow"><p>Colors come from HSL component variables like <code>hsl(var(--background))</code>.</p><div class="muted">Muted block</div><p><button class="btn">Primary</button></p></div>
  <div class="card tw-bg"><span class="tw-text">Tailwind v3 rgb(… / var(--tw-bg-opacity)) utilities.</span></div>
</body>
</html>
